name: rust

on:
  push:
    branches: [ main, rust-rewrite ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/parity/**'
      - 'Makefile'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/parity/**'
      - 'Makefile'
      - '.github/workflows/rust.yml'
  schedule:
    # Nightly parity run at 07:17 UTC (weekdays only). Phase 0 allows failure.
    - cron: '17 7 * * 1-5'
  workflow_dispatch:
    inputs:
      full_wheel_matrix:
        description: "Build all wheel targets (incl. macOS Intel), same as a release"
        type: boolean
        default: true

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read-only. Individual jobs override only what they need.
# Mitigates CodeQL/CWE-275 (missing-workflow-permissions): the GITHUB_TOKEN
# defaults to whatever the repo policy is, which can be read-write. Pinning
# this here means even if the repo default changes, this workflow stays safe.
permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install stable toolchain
        # Pin action code to @stable (latest fixes), toolchain version
        # via input. The @1.95.0 ref shipped action code that errors on
        # ubuntu-latest with `detected conflict: 'bin/cargo-clippy'`
        # because the pre-installed runner Rust collides with the
        # clippy-preview component install.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  wheel-matrix:
    name: compute wheel matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Select wheel targets
        id: set
        # Cost optimization: macOS runners bill at ~10x Linux minutes.
        # On regular pushes/PRs we only smoke-test Linux + macOS Apple
        # Silicon (the more common target). The macOS Intel build is
        # skipped there and only runs on real release tags or a manual
        # workflow_dispatch with full_wheel_matrix=true, so every
        # published release still gets full 3-platform coverage.
        run: |
          FULL=false
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            FULL=true
          elif [[ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_wheel_matrix == 'true' }}" == "true" ]]; then
            FULL=true
          fi

          if [[ "$FULL" == "true" ]]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","maturin-target":"x86_64"},{"os":"macos-14","target":"aarch64-apple-darwin","maturin-target":"aarch64-apple-darwin"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","maturin-target":"x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","maturin-target":"x86_64"},{"os":"macos-14","target":"aarch64-apple-darwin","maturin-target":"aarch64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: wheels (${{ matrix.target }})
    needs: wheel-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.wheel-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: "Build wheel (single-wheel architecture builds headroom-ai)"
        # Maturin reads `[tool.maturin]` from the root `pyproject.toml`
        # which points at `crates/headroom-py/Cargo.toml` for the cdylib.
        # Output is `headroom_ai-<ver>-<py>-<py>-<platform>.whl` containing
        # both Python source and the compiled `headroom/_core.so`.
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.maturin-target }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit + cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (soft-fail)
        continue-on-error: true
        run: cargo audit
      - name: cargo deny check licenses
        continue-on-error: true
        run: cargo deny check licenses

  parity-nightly:
    name: parity (nightly, allowed to fail during Phase 0)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - name: Install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          pip install -e .
      - name: Run parity harness
        run: |
          source .venv/bin/activate
          make test-parity
